name: glyphh-ai

services:
  db_runtime:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: glyphh
      POSTGRES_PASSWORD: glyphh
      POSTGRES_DB: glyphh_runtime
    ports:
      - "5432:5432"
    volumes:
      - glyphh_runtime_db_data:/var/lib/postgresql/data
      - ./docker/pgvector.sql:/docker-entrypoint-initdb.d/01_pgvector.sql:ro
  db_platform:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: glyphh
      POSTGRES_PASSWORD: glyphh
      POSTGRES_DB: glyphh_platform
    ports:
      - "5433:5432"
    volumes:
      - glyphh_platform_db_data:/var/lib/postgresql/data
      - ./docker/pgvector.sql:/docker-entrypoint-initdb.d/01_pgvector.sql:ro
  runtime:
    build:
      context: ..
      dockerfile: glyphh-runtime/Dockerfile
      args:
        HF_TOKEN: ${GLYPH_HF_TOKEN:-}
    environment:
      GLYPH_DATABASE_URL: postgresql+psycopg://glyphh:glyphh@db_runtime:5432/glyphh_runtime
    ports:
      - "8080:8080"
    depends_on:
      - db_runtime
  platform:
    build:
      context: ..
      dockerfile: glyphh-platform/Dockerfile
    env_file:
      - ../glyphh-platform/.env
    environment:
      GLYPH_DATABASE_URL: postgresql+psycopg://glyphh:glyphh@db_platform:5432/glyphh_platform
    ports:
      - "8000:8000"
    depends_on:
      - db_platform

volumes:
  glyphh_runtime_db_data:
  glyphh_platform_db_data:
