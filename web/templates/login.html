<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>glyphh &middot; Login</title>
{% if favicon_b64 %}
<link rel="icon" type="image/png" href="data:image/png;base64,{{ favicon_b64 }}">
{% endif %}
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-page">
  <div class="login-container">
    <div class="login-logo">
      {% if logo_b64 %}
      <img src="data:image/png;base64,{{ logo_b64 }}" alt="glyphh">
      {% else %}
      <span class="wordmark">glyphh</span>
      {% endif %}
    </div>
    <h1 class="login-title">Sign in</h1>
    <p class="login-subtitle">Authenticate with the Glyphh platform</p>

    <form class="login-form" id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" placeholder="Your password" required autocomplete="current-password">
      </div>
      <div class="login-error" id="login-error"></div>
      <button class="btn-primary" type="submit" id="login-btn">Sign in</button>
    </form>
  </div>
</div>

<script type="module">
import { login } from '/static/js/auth.js';

const form = document.getElementById('login-form');
const btn = document.getElementById('login-btn');
const errorEl = document.getElementById('login-error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    await login(email, password);
    // Redirect to dashboard
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = err.message || 'Login failed';
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
