# Heroku Container Deployment Configuration
# 
# Deploy using: heroku stack:set container
# Then: git push heroku main

setup:
  addons:
    - plan: heroku-postgresql:essential-0
      as: DATABASE

build:
  docker:
    web: Dockerfile
  config:
    ENABLE_NL_QUERY: "false"
    SDK_REF: main

run:
  web: uvicorn main:app --host 0.0.0.0 --port $PORT

release:
  image: web
  command:
    - alembic upgrade head
