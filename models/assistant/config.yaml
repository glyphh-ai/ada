# Glyphh CLI Assistant Model
# This model powers the interactive CLI assistant using HDC

name: glyphh-cli-assistant
version: 0.1.0
description: |
  An HDC-powered assistant for the Glyphh CLI.
  Understands natural language queries about Glyphh concepts,
  commands, workflows, and helps users build GQL queries.

author: Glyphh AI
license: MIT

# Encoder configuration
encoder:
  dimensions: 10000
  method: bipolar
  ngram_range: [1, 3]
  
# Roles define the schema for this model
roles:
  # What type of content this is
  content_type:
    type: categorical
    values:
      - command      # CLI command help
      - concept      # Glyphh concept explanation
      - workflow     # Multi-step workflow
      - gql          # GQL syntax/examples
      - error        # Error message help
      - faq          # Frequently asked question
      
  # Intent category
  intent:
    type: categorical
    values:
      - help
      - build
      - query
      - deploy
      - explain
      - troubleshoot
      
  # The question/trigger text (what user might ask)
  question:
    type: text
    primary: true
    
  # The response/answer
  response:
    type: text
    
  # Related CLI command if applicable
  command:
    type: text
    optional: true
    
  # Code/GQL snippet if applicable
  code:
    type: text
    optional: true
    
  # Keywords for matching
  keywords:
    type: list
    optional: true

# Similarity settings
similarity:
  threshold: 0.6
  top_k: 3
