# Glyphh Actions Model
# Routes user intents to executable platform API actions.
# Companion to the assistant (knowledge) model.

name: glyphh-actions
version: 0.1.0
description: |
  Action routing model for the Glyphh platform.
  Maps natural language requests to executable API actions
  with slot extraction, auth requirements, and confirmation flags.

author: Glyphh AI
license: MIT

encoder:
  dimensions: 10000
  method: bipolar
  ngram_range: [1, 3]

roles:
  # Action category
  action_type:
    type: categorical
    values:
      - auth          # Authentication actions
      - account       # Account management
      - billing       # Billing and subscription
      - model         # Model management
      - runtime       # Runtime operations
      - support       # Support and help

  # The trigger phrase (what user might say)
  trigger:
    type: text
    primary: true

  # Canonical action name
  action_name:
    type: text

  # Required slots (comma-separated)
  required_slots:
    type: text
    optional: true

  # Keywords for matching
  keywords:
    type: list
    optional: true

similarity:
  threshold: 0.5
  top_k: 3
