name: Build and Publish Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Image variant to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - full
          - lite

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: glyphh-ai/glyphh-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        variant: [full, lite]
        exclude:
          - variant: ${{ github.event.inputs.variant == 'lite' && 'full' || '' }}
          - variant: ${{ github.event.inputs.variant == 'full' && 'lite' || '' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ matrix.variant == 'full' && github.ref == 'refs/heads/main' }}
            type=raw,value=lite,enable=${{ matrix.variant == 'lite' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-${{ matrix.variant }}
            type=sha,prefix=${{ matrix.variant }}-
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENABLE_NL_QUERY=${{ matrix.variant == 'full' }}
            SDK_REF=main
            SDK_TOKEN=${{ secrets.SDK_RELEASES_TOKEN }}
            HF_TOKEN=${{ matrix.variant == 'full' && secrets.HUGGINGFACE_HUB_TOKEN || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant == 'full' && 'latest' || 'lite' }}
          format: spdx-json
          output-file: sbom-${{ matrix.variant }}.spdx.json
      
      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.variant }}
          path: sbom-${{ matrix.variant }}.spdx.json

  test:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glyphh_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Test lite image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:lite
          docker run --rm \
            -e DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/glyphh_runtime_test \
            -e DEPLOYMENT_MODE=local \
            --add-host=host.docker.internal:host-gateway \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:lite \
            python -c "from main import app; print('Import successful')"
