name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate: run full regression suite before building
  regression-tests:
    name: Regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11']
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: glyphh
          POSTGRES_PASSWORD: glyphh_test
          POSTGRES_DB: glyphh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          DATABASE_URL: postgresql://glyphh:glyphh_test@localhost:5432/glyphh_test

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          DATABASE_URL: postgresql://glyphh:glyphh_test@localhost:5432/glyphh_test

  build-and-push:
    name: Build and push Docker image
    needs: regression-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: lite
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SDK_REF=main
            SDK_TOKEN=${{ secrets.SDK_RELEASES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM to runtime release
        uses: softprops/action-gh-release@v1
        with:
          files: sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Cross-publish to the public repo (glyphh-ai/public)
  publish-to-public:
    name: Publish to public repo
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create public release for runtime
        uses: softprops/action-gh-release@v1
        with:
          repository: glyphh-ai/public
          tag_name: runtime-${{ steps.version.outputs.tag }}
          name: "Glyphh Runtime ${{ steps.version.outputs.tag }}"
          body: |
            ## Glyphh Runtime ${{ steps.version.outputs.tag }}

            ### Docker
            ```bash
            docker pull ghcr.io/glyphh-ai/glyphh-runtime:${{ steps.version.outputs.tag }}
            ```

            ### Deployment
            See [deployment docs](https://docs.glyphh.ai/deployment) for setup instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_RELEASES_TOKEN }}
