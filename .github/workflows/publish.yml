name: Publish the SDKs

# A tag `sdk-v<version>` publishes @glyphh-ai/ada to npm and glyphh-ada to PyPI.
# Both go through Trusted Publishing: the job's GitHub identity signs the
# publish, so no token is stored. The tag must be the version in both packages.

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The tag must be both packages' version
        if: github.event_name == 'push'
        run: |
          ts="$(node -p "require('./sdk/typescript/package.json').version")"
          py="$(python -c "import tomllib; print(tomllib.load(open('sdk/python/pyproject.toml', 'rb'))['project']['version'])")"
          [ "${GITHUB_REF_NAME}" = "sdk-v${ts}" ] && [ "${ts}" = "${py}" ] || { echo "tag ${GITHUB_REF_NAME}, npm ${ts}, PyPI ${py}"; exit 1; }
      - name: TypeScript
        working-directory: sdk/typescript
        run: |
          npm install
          npm test
      - name: Python
        working-directory: sdk/python
        run: |
          python -m pip install '.[dev]'
          python -m pytest tests -q

  npm:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@11
      - working-directory: sdk/typescript
        run: |
          npm install
          npm run build
          npm publish --access public --provenance

  pypi:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - working-directory: sdk/python
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist
