name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: glyphh
          POSTGRES_PASSWORD: glyphh_test
          POSTGRES_DB: glyphh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Glyphh SDK
        run: pip install "glyphh @ git+https://${{ secrets.RUNTIME_SDK_TOKEN }}@github.com/glyphh-ai/glyphh-sdk.git@${{ secrets.RUNTIME_SDK_REF || 'main' }}"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          DATABASE_URL: postgresql://glyphh:glyphh_test@localhost:5432/glyphh_test

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          DATABASE_URL: postgresql://glyphh:glyphh_test@localhost:5432/glyphh_test
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install ruff mypy

      - name: Run ruff
        run: ruff check .
        continue-on-error: true

      - name: Run mypy
        run: mypy domains/ api/ --ignore-missing-imports
        continue-on-error: true

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: glyphh-runtime:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm glyphh-runtime:test python -c "print('✓ Container starts')"
