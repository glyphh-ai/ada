name: Runtime Release Artifact

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-runtime-artifacts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_tag: manylinux_2_24_x86_64
          - os: macos-14
            platform_tag: macosx_11_0_arm64
          - os: windows-latest
            platform_tag: win_amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build runtime bundle
        shell: bash
        env:
          PLATFORM_TAG: ${{ matrix.platform_tag }}
          RUNTIME_SDK_REF: ${{ vars.RUNTIME_SDK_REF }}
          SDK_REPO_TOKEN: ${{ secrets.RUNTIME_SDK_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          SDK_REF="${RUNTIME_SDK_REF:-main}"
          export WORK_DIR="$(pwd)"
          export BUILD_DIR="${WORK_DIR}/dist/glyphh-runtime-${TAG}-${PLATFORM_TAG}"
          mkdir -p "${BUILD_DIR}"

          python -m venv --copies "${BUILD_DIR}/venv"
          VENV_PY="${BUILD_DIR}/venv/bin/python"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            VENV_PY="${BUILD_DIR}/venv/Scripts/python.exe"
          fi
          "${VENV_PY}" -m pip install --upgrade pip
          "${VENV_PY}" -m pip install maturin

          if [ -z "${SDK_REPO_TOKEN}" ]; then
            echo "Missing SDK_REPO_TOKEN secret for glyphh-sdk access." >&2
            exit 1
          fi
          SDK_BUILD_DIR="$(mktemp -d)"
          git clone --depth 1 --branch "${SDK_REF}" \
            "https://x-access-token:${SDK_REPO_TOKEN}@github.com/glyphh-ai/glyphh-sdk.git" \
            "${SDK_BUILD_DIR}"
          (
            cd "${SDK_BUILD_DIR}"
            "${VENV_PY}" -m maturin build --release --strip -o "${BUILD_DIR}/wheels"
          )
          rm -rf "${SDK_BUILD_DIR}"

          "${VENV_PY}" -m pip install -r requirements.txt
          "${VENV_PY}" -m pip install "${BUILD_DIR}/wheels/"*.whl
          "${VENV_PY}" -m pip install "huggingface_hub>=0.22.0"

          "${VENV_PY}" - <<'PY'
          import os
          import shutil
          from pathlib import Path

          src = Path(os.environ["WORK_DIR"])
          dst = Path(os.environ["BUILD_DIR"]) / "app"
          dst.mkdir(parents=True, exist_ok=True)
          excluded = {".git", "__pycache__", "dist", "node_modules", "venv", "glyphh-sdk"}

          for item in src.iterdir():
            if item.name in excluded:
              continue
            target = dst / item.name
            if item.is_dir():
              shutil.copytree(item, target, dirs_exist_ok=True)
            else:
              shutil.copy2(item, target)
          PY

          export MODEL_DIR="${BUILD_DIR}/app/models/intent/all-MiniLM-L6-v2"
          mkdir -p "${MODEL_DIR}"
          "${VENV_PY}" -c "import os; from huggingface_hub import snapshot_download; repo_id='sentence-transformers/all-MiniLM-L6-v2'; local_dir=os.environ['MODEL_DIR']; snapshot_download(repo_id=repo_id, local_dir=local_dir, local_dir_use_symlinks=False)"

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'ROOT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'source "${ROOT_DIR}/venv/bin/activate"' \
            'export GLYPH_RUNTIME_PORT="${GLYPH_RUNTIME_PORT:-8080}"' \
            'exec python -m uvicorn api.main:app --host 0.0.0.0 --port "${GLYPH_RUNTIME_PORT}"' \
            > "${BUILD_DIR}/run.sh"
          chmod +x "${BUILD_DIR}/run.sh"

          if [ "${RUNNER_OS}" = "Windows" ]; then
            printf '%s\n' \
              '$Root = Split-Path -Parent $MyInvocation.MyCommand.Path' \
              '& "$Root\\venv\\Scripts\\Activate.ps1"' \
              'if (-not $env:GLYPH_RUNTIME_PORT) { $env:GLYPH_RUNTIME_PORT = "8080" }' \
              'python -m uvicorn api.main:app --host 0.0.0.0 --port $env:GLYPH_RUNTIME_PORT' \
              > "${BUILD_DIR}/run.ps1"
          fi

          tar -czf "dist/glyphh-runtime-${TAG}-${PLATFORM_TAG}.tar.gz" -C "dist" "glyphh-runtime-${TAG}-${PLATFORM_TAG}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path \"dist/glyphh-runtime-${TAG}-${PLATFORM_TAG}\" -DestinationPath \"dist/glyphh-runtime-${TAG}-${PLATFORM_TAG}.zip\""
          else
            (cd dist && zip -r "glyphh-runtime-${TAG}-${PLATFORM_TAG}.zip" "glyphh-runtime-${TAG}-${PLATFORM_TAG}")
          fi

      - name: Mirror release to glyphh-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_RELEASES_TOKEN }}
          RELEASES_REPO: glyphh-ai/glyphh-releases
          PLATFORM_TAG: ${{ matrix.platform_tag }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="dist/release-notes.md"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body -q .body > "${NOTES_FILE}"
          if ! gh release view "${TAG}" --repo "${RELEASES_REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${RELEASES_REPO}" \
              --title "${TAG}" \
              --notes-file "${NOTES_FILE}"
          fi
          gh release upload "${TAG}" \
            dist/glyphh-runtime-"${TAG}"-"${PLATFORM_TAG}".tar.gz \
            dist/glyphh-runtime-"${TAG}"-"${PLATFORM_TAG}".zip \
            --repo "${RELEASES_REPO}" \
            --clobber

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/glyphh-runtime-*.tar.gz
            dist/glyphh-runtime-*.zip
