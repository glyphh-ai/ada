name: Runtime Release Artifact

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-runtime-artifacts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_tag: manylinux_2_24_x86_64
          - os: macos-14
            platform_tag: macosx_11_0_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build runtime bundle
        env:
          PLATFORM_TAG: ${{ matrix.platform_tag }}
          RUNTIME_SDK_REF: ${{ vars.RUNTIME_SDK_REF }}
          SDK_REPO_TOKEN: ${{ secrets.RUNTIME_SDK_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          SDK_REF="${RUNTIME_SDK_REF:-main}"
          WORK_DIR="$(pwd)"
          BUILD_DIR="${WORK_DIR}/dist/glyphh-runtime-${TAG}-${PLATFORM_TAG}"
          mkdir -p "${BUILD_DIR}"

          python -m venv --copies "${BUILD_DIR}/venv"
          "${BUILD_DIR}/venv/bin/python" -m pip install --upgrade pip
          "${BUILD_DIR}/venv/bin/python" -m pip install maturin

          if [ -z "${SDK_REPO_TOKEN}" ]; then
            echo "Missing SDK_REPO_TOKEN secret for glyphh-sdk access." >&2
            exit 1
          fi
          git clone --depth 1 --branch "${SDK_REF}" \
            "https://x-access-token:${SDK_REPO_TOKEN}@github.com/glyphh-ai/glyphh-sdk.git" \
            "${BUILD_DIR}/glyphh-sdk"
          (
            cd "${BUILD_DIR}/glyphh-sdk"
            "${BUILD_DIR}/venv/bin/python" -m maturin build --release --strip -o "${BUILD_DIR}/wheels"
          )

          "${BUILD_DIR}/venv/bin/python" -m pip install -r requirements.txt
          "${BUILD_DIR}/venv/bin/python" -m pip install "${BUILD_DIR}/wheels/"*.whl

          rsync -a \
            --exclude ".git" \
            --exclude "__pycache__" \
            --exclude "dist" \
            --exclude "node_modules" \
            --exclude "venv" \
            "${WORK_DIR}/" "${BUILD_DIR}/app/"

          cat > "${BUILD_DIR}/run.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          source "${ROOT_DIR}/venv/bin/activate"
          export GLYPH_RUNTIME_PORT="${GLYPH_RUNTIME_PORT:-8080}"
          exec python -m uvicorn api.main:app --host 0.0.0.0 --port "${GLYPH_RUNTIME_PORT}"
          EOF
          chmod +x "${BUILD_DIR}/run.sh"

          tar -czf "dist/glyphh-runtime-${TAG}-${PLATFORM_TAG}.tar.gz" -C "dist" "glyphh-runtime-${TAG}-${PLATFORM_TAG}"
          (cd dist && zip -r "glyphh-runtime-${TAG}-${PLATFORM_TAG}.zip" "glyphh-runtime-${TAG}-${PLATFORM_TAG}")

      - name: Mirror release to glyphh-runtime-releases
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_RELEASES_TOKEN }}
          RELEASES_REPO: glyphh-ai/glyphh-runtime-releases
          PLATFORM_TAG: ${{ matrix.platform_tag }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="dist/release-notes.md"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body -q .body > "${NOTES_FILE}"
          if ! gh release view "${TAG}" --repo "${RELEASES_REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${RELEASES_REPO}" \
              --title "${TAG}" \
              --notes-file "${NOTES_FILE}"
          fi
          gh release upload "${TAG}" \
            dist/glyphh-runtime-"${TAG}"-"${PLATFORM_TAG}".tar.gz \
            dist/glyphh-runtime-"${TAG}"-"${PLATFORM_TAG}".zip \
            --repo "${RELEASES_REPO}" \
            --clobber

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/glyphh-runtime-*.tar.gz
            dist/glyphh-runtime-*.zip
